<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Logging View</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #edeef0;
      user-select: none;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 24px;
      text-align: center;
    }

    .team-logo {
      width: clamp(160px, 60vw, 220px);
      height: auto;
      filter: brightness(0) invert(1);
    }

    .sw-logo {
      width: clamp(64px, 24vw, 84px);
      height: auto;
      opacity: 0.9;
    }

    h1 {
      margin: 4px 0 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .author {
      margin: 8px 0 0;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .copy {
      margin: 0;
      font-size: 0.72rem;
      opacity: 0.55;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="../mode-selector/src/logo.svg" alt="Hyperloop UPV" class="team-logo" />
    <img src="../mode-selector/src/Subsystem.png" alt="Hyperloop UPV Software" class="sw-logo" />
    <h1>Hyperloop Control Station — Logging View</h1>
    <p class="author">Javier Ribal del Río — H11</p>
    <p class="copy">© HyperloopUPV - Software</p>
  </div>
</body>

</html>
